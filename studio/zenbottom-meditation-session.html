<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Moxie Studios — Guided meditation</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600&family=DM+Mono&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root{--ink:#131010;--cream:#f5ecdc;--dim:#d0c4b1;--gold:#e7be79;--med:#aaa2ff;--line:rgba(245,236,220,.16);--good:#cfe3b8}*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow-x:hidden;background:radial-gradient(circle at 50% 42%,rgba(112,102,180,.22),transparent 30%),radial-gradient(70vw 65vw at 10% 100%,rgba(81,55,42,.42),transparent 70%),var(--ink);color:var(--cream);font-family:Manrope,sans-serif}.ambient{position:fixed;inset:0;pointer-events:none}.orb{position:absolute;left:50%;top:46%;width:min(60vw,560px);aspect-ratio:1;translate:-50% -50%;border-radius:50%;border:1px solid rgba(170,162,255,.2);box-shadow:0 0 100px rgba(170,162,255,.12),inset 0 0 80px rgba(233,192,120,.08);animation:breathe 9s ease-in-out infinite}.paused .orb{animation-play-state:paused}.wrap{position:relative;z-index:1;min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;padding:25px clamp(18px,4vw,48px) 26px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font:600 28px/.85 "Cormorant Garamond",serif}.brand em{color:var(--gold);font-style:italic}.end{border:1px solid var(--line);border-radius:999px;padding:8px 13px;background:rgba(0,0,0,.15);color:var(--dim);font-size:10px;cursor:pointer}.center{width:min(720px,100%);margin:auto;text-align:center}.kicker{color:var(--med);font:10px DM Mono,monospace;letter-spacing:1.5px;text-transform:uppercase}.center h1{margin:13px 0 10px;font:500 clamp(48px,7vw,78px)/.86 "Cormorant Garamond",serif;letter-spacing:-2px}.intro{margin:0 auto;color:var(--dim);font-size:13px;line-height:1.65;max-width:540px}.time{margin:50px 0 18px;font:500 clamp(60px,9vw,96px)/.8 "Cormorant Garamond",serif;font-variant-numeric:tabular-nums}.cue{min-height:64px;margin:auto;max-width:590px;font:500 clamp(25px,4vw,37px)/1.05 "Cormorant Garamond",serif}.progress{width:min(380px,80%);height:2px;margin:30px auto 0;background:rgba(245,236,220,.12)}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--med),var(--gold));transition:width .5s linear}.controls{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;padding-top:18px}.control{min-height:44px;border:1px solid var(--line);border-radius:999px;padding:0 15px;background:rgba(20,16,16,.65);color:var(--cream);font-size:11px;cursor:pointer}.control.primary{min-width:130px;border-color:rgba(231,190,121,.55);background:var(--gold);color:#352014;font-weight:700}.control[aria-pressed="false"]{color:var(--dim)}.control:focus-visible,.end:focus-visible{outline:2px solid var(--cream);outline-offset:3px}.note{width:100%;min-height:17px;margin-top:5px;color:var(--dim);font-size:9px;text-align:center}.complete{position:fixed;z-index:3;inset:0;display:grid;place-items:center;padding:20px;background:rgba(12,9,9,.78);backdrop-filter:blur(16px)}.complete[hidden]{display:none}.complete-card{width:min(440px,100%);padding:30px;border:1px solid var(--line);border-radius:24px;background:#211714;text-align:center}.complete-card h2{margin:8px 0;font:500 40px/.95 "Cormorant Garamond",serif}.complete-card p{color:var(--dim);font-size:12px;line-height:1.6}.complete-card a{display:block;margin-top:18px;border-radius:999px;padding:12px;background:var(--gold);color:#352014;font-size:11px;font-weight:700;text-decoration:none}@keyframes breathe{50%{transform:scale(1.11);opacity:.65}}@media(prefers-reduced-motion:reduce){.orb{animation:none}}@media(max-width:540px){.time{margin-top:36px}.controls{padding-bottom:4px}}
  .brandmark{height:1.05em;width:auto;display:block;max-width:min(210px,44vw)}</style>
</head>
<body>
<div class="ambient"><div class="orb"></div></div>
<main class="wrap" id="practice">
  <header class="top"><div class="brand"><img class="brandmark" src="assets/moxie-wordmark.png" alt="Moxie Studios" width="480" height="77" /></div><button class="end" id="end" type="button">End session</button></header>
  <section class="center" aria-labelledby="title"><p class="kicker">Guided meditation</p><h1 id="title"></h1><p class="intro" id="intro"></p><div class="time" id="time" aria-label="Time remaining"></div><div class="cue" id="cue" aria-live="polite"></div><div class="progress" aria-hidden="true"><i id="progress"></i></div></section>
  <footer class="controls"><button class="control" id="sound" type="button" aria-pressed="true">Sound on</button><button class="control primary" id="pause" type="button">Begin</button><button class="control" id="voice" type="button" aria-pressed="true">Spoken cues on</button><div class="note" id="note" role="status" aria-live="polite"></div></footer>
</main>
<section class="complete" id="complete" hidden aria-labelledby="completeTitle"><div class="complete-card"><p class="kicker">Session complete</p><h2 id="completeTitle">You made a little room.</h2><p>There is nothing to measure here. Return slowly and take the steadiness that is useful.</p><a href="zenbottom-schedule.html">Back to the schedule</a></div></section>
<script type="module">
  import { ambientLabel, cleanAmbientPreset, createAmbientPlayer } from "./ambient-audio.mjs";
  import { meditationCue, meditationSession } from "./meditation-session-lib.mjs";
  import { completeSlot, loadPlan, savePlan } from "./practice-plan-lib.mjs";
  import { buildUtterance } from "./local-voice-lib.mjs";
  const $=id=>document.getElementById(id), qs=new URLSearchParams(location.search), id=qs.get("session")||"arrival", session=meditationSession(id);
  const duration=Math.max(1,Math.min(60,Math.round(+(qs.get("duration")||5))))*60, preset=cleanAmbientPreset(qs.get("music")||"quiet"), player=createAmbientPlayer();
  let remaining=duration,running=false,timer=null,lastCue="",soundOn=preset!=="quiet",voiceOn=true,started=false,finished=false;
  $("title").textContent=session.title;$("intro").textContent=session.intro;$("sound").textContent=preset==="quiet"?"Quiet":ambientLabel(preset)+" on";$("sound").setAttribute("aria-pressed",String(soundOn));
  const speechOK="speechSynthesis" in window&&"SpeechSynthesisUtterance" in window;if(!speechOK){voiceOn=false;$("voice").disabled=true;$("voice").textContent="Spoken cues unavailable"}
  function format(value){return String(Math.floor(value/60)).padStart(2,"0")+":"+String(value%60).padStart(2,"0")}
  // Voices load asynchronously; touch the list early so the first cue is voiced too.
  if(speechOK){try{window.speechSynthesis.getVoices();window.speechSynthesis.addEventListener("voiceschanged",()=>window.speechSynthesis.getVoices())}catch(e){}}
  // Rate and pitch now live in local-voice-lib so every spoken line matches.
  function speak(text){if(!voiceOn||!speechOK)return;const u=buildUtterance(text,{synth:window.speechSynthesis,Utterance:window.SpeechSynthesisUtterance});if(!u)return;window.speechSynthesis.cancel();window.speechSynthesis.speak(u)}
  function paint(){const elapsed=duration-remaining,cue=meditationCue(session,elapsed,duration);$("time").textContent=format(remaining);$("progress").style.width=(elapsed/duration*100)+"%";if(cue!==lastCue){lastCue=cue;$("cue").textContent=cue;if(started)speak(cue)}}paint();
  async function start(){if(finished)return;started=true;running=true;document.body.classList.remove("paused");$("pause").textContent="Pause";if(soundOn)await player.play(preset);timer=setInterval(()=>{remaining--;paint();if(remaining<=0)finish()},1000)}
  function pause(){running=false;clearInterval(timer);timer=null;player.stop();window.speechSynthesis?.cancel();document.body.classList.add("paused");$("pause").textContent="Continue";$("note").textContent="Paused. Take all the time you need."}
  function markComplete(){const slot=qs.get("slot"),date=qs.get("date"),email=localStorage.getItem("zbStudentEmail")||"",plan=loadPlan(localStorage,email);if(slot&&date&&plan)savePlan(localStorage,email,completeSlot(plan,{slotId:slot,date,practiceMode:qs.get("mode")||"meditation",completedAt:new Date().toISOString()}))}
  function finish(completed=true){if(finished)return;finished=true;running=false;clearInterval(timer);player.stop();window.speechSynthesis?.cancel();if(completed){remaining=0;paint();markComplete()}else{$("completeTitle").textContent="Session ended.";$("complete").querySelector("p:last-of-type").textContent="Your progress was not marked complete. You can return whenever you are ready."}$("complete").hidden=false;$("complete").querySelector("a").focus()}
  $("pause").onclick=()=>running?pause():start();
  $("sound").onclick=async()=>{if(preset==="quiet"){$("note").textContent="This session is set to quiet. Choose a sound in session setup.";return}soundOn=!soundOn;$("sound").setAttribute("aria-pressed",String(soundOn));$("sound").textContent=ambientLabel(preset)+(soundOn?" on":" off");if(running){soundOn?await player.play(preset):player.stop()}};
  $("voice").onclick=()=>{voiceOn=!voiceOn;$("voice").setAttribute("aria-pressed",String(voiceOn));$("voice").textContent="Spoken cues "+(voiceOn?"on":"off");if(!voiceOn)window.speechSynthesis.cancel()};
  $("end").onclick=()=>{if(confirm("End this meditation?"))finish(false)};
  addEventListener("beforeunload",()=>{player.stop();window.speechSynthesis?.cancel()});
</script>
</body></html>
