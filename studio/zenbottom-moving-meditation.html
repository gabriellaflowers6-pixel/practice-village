<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="color-scheme" content="light" />
  <meta name="viewport" content="width=device-width,initial-scale=1"><title>Moxie — Moving meditation</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=DM+Mono&family=Manrope:wght@400;600&display=swap" rel="stylesheet"><style>:root{--i:#11100f;--c:#f5ecdc;--g:#e7be79;--m:#cec3ac}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 45%,#594525,transparent 42%),#11100f;color:var(--c);font-family:Manrope,sans-serif;min-height:100vh}.top{display:flex;justify-content:space-between;padding:26px}.brand{font:600 29px/.8 "Cormorant Garamond",serif}.brand em{color:var(--g)}a{color:var(--m);font:10px DM Mono;text-transform:uppercase;letter-spacing:1px;text-decoration:none}.stage{min-height:calc(100vh - 80px);display:grid;place-items:center;padding:25px;text-align:center}.orb{position:absolute;width:min(72vw,640px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(231,190,121,.24),transparent 67%);animation:pulse 8s ease-in-out infinite}.person{z-index:1;position:relative;width:210px;height:330px;filter:drop-shadow(0 0 28px rgba(231,190,121,.54));transition:1.2s ease}.head,.torso,.legs,.arm{position:absolute;background:linear-gradient(140deg,#ffe4a8,#b87837);display:block}.head{width:54px;height:57px;border-radius:50%;left:78px;top:10px}.torso{width:105px;height:132px;left:52px;top:64px;border-radius:48% 48% 22% 22%}.legs{width:172px;height:85px;left:18px;top:180px;border-radius:70% 15% 72% 22%;transform:rotate(-5deg)}.arm{width:33px;height:143px;top:75px;border-radius:30px;transform-origin:top}.a1{left:55px;transform:rotate(22deg)}.a2{right:55px;transform:rotate(-22deg)}.standing .legs{top:185px;height:145px;width:47px;left:60px;border-radius:30px;transform:rotate(4deg);box-shadow:43px -2px #c28844}.standing .a1{transform:rotate(-142deg)}.standing .a2{transform:rotate(142deg)}.standing .torso{top:64px}.label{z-index:2;position:relative;margin-top:370px}.phase{font:500 49px/.9 "Cormorant Garamond",serif}.cue{color:var(--m);font-size:13px;margin-top:9px}.next{margin-top:24px;border:0;border-radius:999px;padding:12px 20px;background:var(--g);color:#372012;font:600 12px Manrope;cursor:pointer}.steps{margin-top:24px;color:var(--m);font:10px DM Mono;letter-spacing:1px}.steps b{color:var(--g)}@keyframes pulse{50%{transform:scale(1.12);opacity:.6}}@media(prefers-reduced-motion:reduce){.orb{animation:none}}.brandmark{height:1.05em;width:auto;display:block;max-width:min(210px,44vw)}</style></head><body><header class="top"><div class="brand"><img class="brandmark" src="assets/moxie-wordmark.png" alt="Moxie Studios" width="480" height="77" /></div><a href="zenbottom-breath-room.html">← Breath room</a></header><main class="stage"><div class="orb"></div><div class="person" id="person"><i class="head"></i><i class="torso"></i><i class="legs"></i><i class="arm a1"></i><i class="arm a2"></i></div><section class="label"><div class="phase" id="phase">Seated arrival</div><div class="cue" id="cue">Feel the floor supporting you. Take two easy breaths.</div><button class="next" id="next">Begin gentle movement</button><div class="steps" id="steps"><b>01</b> · 02 · 03 · 04 · 05</div></section></main><script>const p=document.querySelector('#person'),phase=document.querySelector('#phase'),cue=document.querySelector('#cue'),steps=document.querySelector('#steps'),data=[['Seated arrival','Feel the floor supporting you. Take two easy breaths.',false],['Come to standing','Take your time. Use a chair or wall if that helps.',true],['Mountain','Let the crown of your head rise while your feet feel the ground.',true],['Reach upward','Inhale and make space through both sides of your waist.',true],['Return to sitting','Exhale. Come back down slowly and rest your hands.',false]];let i=0;document.querySelector('#next').onclick=()=>{i=(i+1)%data.length;const d=data[i];phase.textContent=d[0];cue.textContent=d[1];p.classList.toggle('standing',d[2]);steps.innerHTML=data.map((_,n)=>n===i?'<b>0'+(n+1)+'</b>':'0'+(n+1)).join(' · ')}</script></body></html>
