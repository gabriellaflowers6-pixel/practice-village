<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>fake students</title>
<style>body{font:13px monospace;background:#241310;color:#8cc99e;padding:16px}</style>
</head><body><pre id="log">starting…</pre>
<script src="vendor/livekit-client.umd.min.js"></script>
<script type="module">
import { joinClass } from "./live-video.js";
const Q = new URLSearchParams(location.search);
const room = (Q.get("class") || "ZEN-TST").toUpperCase();
const n = Math.min(60, parseInt(Q.get("n")) || 25);
const NAMES = ["Ana","Ben","Cara","Dee","Eli","Fay","Gus","Hana","Iris","Jo","Kai","Lena","Mo","Nia","Owen","Pia","Quinn","Rae","Sam","Tess","Uma","Vic","Wren","Xio","Yara","Zed"];
const POSES = ["mountain","warrior","tree","chair","goddess"];
const FLAGS = [null,null,null,"leftKnee","hips","shoulders"];
const log = m => document.getElementById("log").textContent += "\n" + m;
let phase = 0;
setInterval(() => phase++, 25000);          // the whole class changes pose every 25s
for (let i = 0; i < n; i++) {
  const name = NAMES[i % NAMES.length] + (i >= NAMES.length ? i : "");
  joinClass({ room, name, role: "student" }).then(s => {
    log("joined: " + name);
    const watchingOnly = i % 10 === 9;      // every 10th student has no camera
    const laggard = i % 7 === 6;            // some students are a pose behind
    setInterval(() => {
      if (watchingOnly) { s.sendData({ t: "watching" }); return; }
      const p = POSES[(phase - (laggard ? 1 : 0) + POSES.length) % POSES.length];
      s.sendData({ t: "pulse", pose: p, conf: 0.9,
                   flag: FLAGS[(i + phase) % FLAGS.length] });
    }, 2000);
  }).catch(e => log("failed " + name + ": " + e.message));
}
</script></body></html>
